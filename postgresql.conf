# Hypergres postgresql.conf — vanilla PostgreSQL 17 for Cloudflare Hyperdrive.
# Consumed by Task 2 (disposable Hyperdrive-shape verify) and the Harvy sync plan.
# NOTE: the apko image does not load this file (apko cannot embed host files);
# it passes each value below as a postgres -c flag from the shell-fragment
# entrypoint in apko.yaml. This file documents the same values for
# mount-based use. If you change a value here, change apko.yaml to match.

listen_addresses = '*'
ssl = on
max_connections = 100
shared_buffers = 128MB
statement_timeout = '30s'
idle_in_transaction_session_timeout = '60s'
log_connections = on
password_encryption = 'scram-sha-256'  # effective: initdb --auth=scram sets it; entrypoint also passes -c

# application_name is a client-side passthrough: the server does not set it.
# Clients MUST send application_name (e.g. hypergres/<stack>) so Task 2 and
# Hyperdrive pooling attribution can assert it via pg_stat_activity.
# application_name = ''  # intentionally unset — client-provided only.
