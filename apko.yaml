contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - postgresql-17
    - postgresql-17-client
    - ca-certificates
    - tzdata
    - su-exec

accounts:
  groups:
    - groupname: postgres
      gid: 65532
  users:
    - username: postgres
      uid: 65532
      gid: 65532
  run-as: postgres

paths:
  # Writable homes for uid 65532 (apko runs the image as `postgres`, never root).
  - path: /var/lib/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/postgresql/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

# NOTE: this apko version cannot copy host files into the image (paths only
# supports directory/empty-file/link/permissions mutations), so entrypoint.sh
# and postgresql.conf live in the repo for mounting/inspection and their
# effective values are inlined here. Keep the two in sync manually.
entrypoint:
  shell-fragment: |
    set -eu
    PGDATA=${PGDATA:-/var/lib/postgresql/data}
    mkdir -p "$PGDATA"
    if [ ! -s "$PGDATA/PG_VERSION" ]; then
      if [ -n "${POSTGRES_PASSWORD:-}" ]; then
        PWFILE="$(mktemp)"
        printf '%s' "$POSTGRES_PASSWORD" > "$PWFILE"
        initdb -D "$PGDATA" --auth=scram-sha-256 --username=postgres --pwfile="$PWFILE"
        rm -f "$PWFILE"
      else
        initdb -D "$PGDATA" --auth=trust --username=postgres
      fi
    fi
    if [ -f "$PGDATA/server.crt" ] && [ -f "$PGDATA/server.key" ]; then
      SSL="-c ssl=on -c ssl_cert_file=$PGDATA/server.crt -c ssl_key_file=$PGDATA/server.key"
    else
      echo 'hypergres: no TLS cert mounted; starting with ssl=off' >&2
      SSL="-c ssl=off"
    fi
    # Mirrors postgresql.conf values verbatim.
    exec postgres -D "$PGDATA" \
      -c listen_addresses='*' \
      $SSL \
      -c max_connections=100 \
      -c shared_buffers=128MB \
      -c statement_timeout=30s \
      -c idle_in_transaction_session_timeout=60s \
      -c log_connections=on

archs:
  - arm64
  - amd64
